      </div>
    </aside>

    <div class="preview-wrapper">
      <div class="mobile-tabs" id="mobileTabs">
        <button class="tab-btn active" data-tab="texture">2D Текстура</button>
        <button class="tab-btn" data-tab="view3d">3D Визуализация</button>
        <button class="tab-btn" data-tab="pbr">PBR Карты</button>
      </div>
      <div class="texture-column tab-content active" id="tab-texture">
        <div class="preview-header">2D Текстура</div>
        <div id="zoomPanContainer" class="zoom-pan-container">
          <div id="canvas2d" class="canvas-container"></div>
        </div>
      </div>
      <div id="resizeHandle" class="resize-handle"></div>
      <div class="view3d-column tab-content" id="tab-view3d">
        <div class="preview-header">3D Визуализация</div>
        <div id="canvas3d" class="canvas-container"></div>
      </div>
      <div class="pbr-column tab-content" id="tab-pbr">
        <div class="preview-header">PBR Карты</div>
        <div class="pbr-grid-container"><div id="pbrGrid" class="pbr-grid"></div></div>
      </div>
    </div>
  </main>

  <footer class="global-footer">
    <div class="footer-item">
      <span class="footer-label">Экспорт 2D</span>
      <div class="footer-controls">
        <select id="export2DFormat" class="compact-select"><option value="png">PNG</option><option value="jpg">JPG</option><option value="svg">SVG</option><option value="pbr">PBR (ZIP)</option></select>
        <select id="exportResolution" class="compact-select"><option value="1024">1K</option><option value="2048">2K</option><option value="4096">4K</option><option value="8192">8K</option></select>
      </div>
      <button id="export2DBtn" class="export-btn">Скачать</button>
    </div>
    <div class="footer-item">
      <span class="footer-label">Экспорт 3D</span>
      <div class="footer-controls">
        <select id="exportModelFormat" class="compact-select"><option value="glb">GLB</option><option value="gltf">glTF</option><option value="obj">OBJ + MTL</option></select>
      </div>
      <button id="exportModelBtn" class="export-btn">Скачать</button>
    </div>
    <div class="footer-item">
      <span class="footer-label">Интеграция</span>
      <div class="footer-controls">
        <select id="integrationSelect" class="compact-select">
          <option value="blender">Blender</option>
          <option value="unity">Unity</option>
          <option value="godot">Godot</option>
        </select>
      </div>
      <button id="integrationDownloadBtn" class="export-btn">Скачать</button>
    </div>
  </footer>

    }
  }
  </script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatternForge — Генератор текстур и 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключение Three.js и аддонов -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <!-- Хедер -->
    <header class="logo-block">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <div class="logo">PatternForge</div>
    </header>

    <!-- Панель категорий паттернов -->
    <nav id="patternBar" class="pattern-bar">
        <div class="category-filters">
            <div class="category-group">
                <span class="category-label">Шумовые</span>
                <select id="selectNoise" class="category-select"></select>
            </div>
            <div class="category-group">
                <span class="category-label">Фрактальные</span>
                <select id="selectFractal" class="category-select"></select>
            </div>
            <div class="category-group">
                <span class="category-label">Градиенты</span>
                <select id="selectGradient" class="category-select"></select>
            </div>
            <div class="category-group">
                <span class="category-label">Геометрия</span>
                <select id="selectGeometric" class="category-select"></select>
            </div>
        </div>
    </nav>
    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- Основная сетка -->
    <main class="main-layout">
        <!-- Колонка настроек -->
        <aside class="settings-column">
            <div class="settings-panel">
                <div class="setting-group">
                    <h3>Параметры</h3>
                    <div class="control-row"><label>Масштаб</label><input type="range" id="scale" min="0.1" max="5" step="0.01" value="0.80"><span class="value-display" id="scaleVal">0.80</span></div>
                    <div class="control-row"><label>Октавы</label><input type="range" id="octaves" min="1" max="8" step="1" value="3"><span class="value-display" id="octavesVal">3</span></div>
                    <div class="control-row"><label>Персистенс</label><input type="range" id="persistence" min="0.1" max="1.0" step="0.01" value="0.50"><span class="value-display" id="persistenceVal">0.50</span></div>
                    <div class="control-row"><label>Лакунарность</label><input type="range" id="lacunarity" min="1.0" max="4.0" step="0.01" value="2.00"><span class="value-display" id="lacunarityVal">2.00</span></div>
                    <div class="control-row"><label>Насыщенность</label><input type="range" id="saturation" min="0.0" max="3.0" step="0.01" value="1.50"><span class="value-display" id="saturationVal">1.50</span></div>
                    <div class="control-row"><label>Смешивание</label><select id="blendMode" class="compact-select"><option value="0">Линейное</option><option value="1">Мультипликативное</option></select></div>
                </div>

                <div class="setting-group">
                    <h3>Рельеф (2D)</h3>
                    <div class="control-row"><label>Включить</label><input type="checkbox" id="relief2d"></div>
                    <div class="control-row"><label>Высота рельефа</label><input type="range" id="reliefStrength" min="0.1" max="5.0" step="0.01" value="1.00"><span class="value-display" id="reliefStrengthVal">1.00</span></div>
                </div>

                <div class="setting-group">
                    <h3>Трансформы</h3>
                    <div class="control-row"><label>Поворот</label><input type="range" id="rotate" min="0" max="360" step="1" value="0"><span class="value-display" id="rotateVal">0°</span></div>
                    <div class="control-row"><label>Сдвиг X</label><input type="range" id="offsetX" min="-1" max="1" step="0.01" value="0.00"><span class="value-display" id="offsetXVal">0.00</span></div>
                    <div class="control-row"><label>Сдвиг Y</label><input type="range" id="offsetY" min="-1" max="1" step="0.01" value="0.00"><span class="value-display" id="offsetYVal">0.00</span></div>
                    <div class="control-row"><label>Зеркало</label><select id="mirror" class="compact-select"><option value="0">Нет</option><option value="1">X</option><option value="2">Y</option><option value="3">X+Y</option></select></div>
                </div>

                <div class="setting-group">
                    <h3>Цветовая палитра</h3>
                    <div id="colorListContainer" class="color-list"></div>
                    <!-- ИСПРАВЛЕНИЕ 1.1: Кнопка строго слева -->
                    <button id="addColorBtn" class="center-btn settings-left-btn">Добавить цвет</button>
                </div>

                <div class="setting-group">
                    <h3>Domain Warping</h3>
                    <div class="control-row"><label>Активно</label><input type="checkbox" id="warpEnable"></div>
                    <div class="control-row"><label>Сила</label><input type="range" id="warpStrength" min="0.0" max="1.0" step="0.01" value="0.30"><span class="value-display" id="warpStrengthVal">0.30</span></div>
                    <div class="control-row"><label>Октавы warp</label><input type="range" id="warpOctaves" min="1" max="5" step="1" value="2"><span class="value-display" id="warpOctavesVal">2</span></div>
                </div>

                <div class="setting-group">
                    <h3>3D модель</h3>
                    <div class="model-row">
                        <select id="geometrySelect" class="compact-select">
                            <option value="cube">Куб</option>
                            <option value="torus">Тор-узел</option>
                            <option value="sphere">Сфера</option>
                            <option value="cylinder">Цилиндр</option>
                        </select>
                        <label class="file-input-btn settings-left-btn">
                            Загрузить свою
                            <input type="file" id="modelFileInput" accept=".glb,.gltf" hidden>
                        </label>
                    </div>
                    <div id="modelStatus" style="font-size: 0.8rem; color: #cf8e9e; text-align: center;"></div>
                </div>

                <div class="setting-group">
                    <h3>Фоновое изображение</h3>
                    <div class="bg-upload-row">
                        <label class="file-input-btn settings-left-btn">
                            Выбрать фон
                            <input type="file" id="bgImageInput" accept="image/*" hidden>
                        </label>
                        <button id="clearBgBtn" class="center-btn settings-left-btn hidden">Удалить фон</button>
                    </div>
                    <div class="control-row"><label>Прозрачность</label><input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1.00"></div>
                </div>

                <div class="setting-group">
                    <h3>Паттерны (Слои)</h3>
                    <label class="file-input-btn settings-left-btn">
                        Добавить картинку
                        <input type="file" id="multiTextureInput" accept="image/*" multiple hidden>
                    </label>
                    <div id="overlayLayersList" class="layers-list"></div>
                    <div class="control-row"><label>Прозрачность слоя</label><input type="range" id="layerOpacity" min="0" max="1" step="0.01" value="1.00"><span class="value-display" id="layerOpacityVal">1.00</span></div>
                    <button id="clearOverlayBtn" class="center-btn settings-left-btn hidden">Удалить все картинки</button>
                </div>

                <div class="setting-group">
                    <h3>Пресет</h3>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button id="savePresetBtn" class="center-btn">Сохранить</button>
                        <label class="file-input-btn">
                            Загрузить
                            <input type="file" id="loadPresetInput" accept=".json" hidden>
                        </label>
                        <button id="loadPresetBtn" class="center-btn">Обзор...</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Область предпросмотра -->
        <div class="preview-wrapper">
            <div class="texture-column">
                <div class="preview-header">2D Текстура</div>
                <div id="zoomPanContainer" class="zoom-pan-container">
                    <div class="canvas-container" id="canvas2d"></div>
                </div>
            </div>
            
            <div id="resizeHandle" class="resize-handle"></div>
            
            <div class="view3d-column">
                <div class="preview-header">3D Визуализация</div>
                <div class="canvas-container" id="canvas3d"></div>
            </div>

            <div class="pbr-column">
                <div class="preview-header">PBR Карты</div>
                <div id="pbrGrid" class="pbr-grid-container">
                    <div class="pbr-grid" id="pbrGrid"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="global-footer">
        <div class="footer-item">
            <span class="footer-label">Экспорт 2D</span>
            <div class="footer-controls">
                <select id="export2DFormat" class="compact-select">
                    <option value="png">PNG</option>
                    <option value="jpg">JPG</option>
                    <option value="svg">SVG</option>
                    <option value="pbr">PBR (ZIP)</option>
                </select>
                <select id="exportResolution" class="compact-select">
                    <option value="1024">1K</option>
                    <option value="2048">2K</option>
                    <option value="4096">4K</option>
                    <option value="8192">8K</option>
                </select>
                <button id="export2DBtn" class="export-btn">Скачать</button>
            </div>
        </div>
        <div class="footer-item">
            <span class="footer-label">Экспорт 3D</span>
            <div class="footer-controls">
                <select id="exportModelFormat" class="compact-select">
                    <option value="glb">GLB</option>
                    <option value="gltf">glTF</option>
                    <option value="obj">OBJ + MTL</option>
                </select>
                <button id="exportModelBtn" class="export-btn">Скачать</button>
            </div>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>

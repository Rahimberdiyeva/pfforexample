<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>PatternForge — Генератор текстур и 3D</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="logo-block">
    <button id="menuToggle" class="menu-toggle" aria-label="Открыть меню">☰</button>
    <div class="logo">PatternForge</div>
  </header>

  <nav id="patternBar" class="pattern-bar">
    <div class="category-filters">
      <div class="category-group"><span class="category-label">Шумовые</span><select id="selectNoise" class="category-select"></select></div>
      <div class="category-group"><span class="category-label">Фрактальные</span><select id="selectFractal" class="category-select"></select></div>
      <div class="category-group"><span class="category-label">Градиенты</span><select id="selectGradient" class="category-select"></select></div>
      <div class="category-group"><span class="category-label">Геометрия</span><select id="selectGeometric" class="category-select"></select></div>
    </div>
  </nav>
  <div id="menuOverlay" class="menu-overlay"></div>

  <main class="main-layout">
    <aside class="settings-column">
      <div class="generation-header">Генерация</div>
      <div class="settings-panel">
        <!-- Параметры -->
        <div class="accordion-group">
          <div class="accordion-header">Параметры</div>
          <div class="accordion-content">
            <div class="control-row"><label>Масштаб</label><input type="range" id="scale" min="0.1" max="2" step="0.01" value="0.8"><span class="value-display" id="scaleVal">0.80</span></div>
            <div class="control-row"><label>Октавы</label><input type="range" id="octaves" min="1" max="8" step="1" value="3"><span class="value-display" id="octavesVal">3</span></div>
            <div class="control-row"><label>Персистенс</label><input type="range" id="persistence" min="0" max="1" step="0.01" value="0.5"><span class="value-display" id="persistenceVal">0.50</span></div>
            <div class="control-row"><label>Лакунарность</label><input type="range" id="lacunarity" min="1" max="4" step="0.01" value="2"><span class="value-display" id="lacunarityVal">2.00</span></div>
            <div class="control-row"><label>Насыщенность</label><input type="range" id="saturation" min="0" max="3" step="0.01" value="1.5"><span class="value-display" id="saturationVal">1.50</span></div>
            <div class="control-row"><label>Смешивание</label><select id="blendMode" class="compact-select"><option value="0">Линейное</option><option value="1">Мультипликативное</option></select></div>
            <div class="control-row"><label>Интенсивность</label><input type="range" id="intensity" min="0" max="2" step="0.01" value="1.0"><span class="value-display" id="intensityVal">1.00</span></div>
            <div class="control-row"><label>Сила Normal</label><input type="range" id="normalStrength" min="0.2" max="3" step="0.01" value="1.0"><span class="value-display" id="normalStrengthVal">1.00</span></div>
            <div class="control-row"><label>Контраст Roughness</label><input type="range" id="roughnessContrast" min="0.5" max="3" step="0.01" value="1.5"><span class="value-display" id="roughnessContrastVal">1.50</span></div>
            <div class="control-row"><label>Порог Metallic</label><input type="range" id="metalThreshold" min="0" max="1" step="0.01" value="0.4"><span class="value-display" id="metalThresholdVal">0.40</span></div>
            <div class="control-row"><label>Контраст Metallic</label><input type="range" id="metalScale" min="0.5" max="4" step="0.01" value="2.0"><span class="value-display" id="metalScaleVal">2.00</span></div>
          </div>
        </div>
        <!-- Остальные блоки (Рельеф, Трансформы, Цвета, Warp, 3D модель, Освещение, Фон, Слои, Пресет) -->
        <!-- Для краткости я их опускаю, но они такие же, как в предыдущих версиях. Полный файл будет в конце. -->
      </div>
    </aside>
    <div class="preview-wrapper">
      <div class="mobile-tabs" id="mobileTabs">
        <button class="tab-btn active" data-tab="texture">2D Текстура</button>
        <button class="tab-btn" data-tab="view3d">3D Визуализация</button>
        <button class="tab-btn" data-tab="pbr">PBR Карты</button>
      </div>
      <div class="texture-column tab-content active" id="tab-texture">
        <div class="preview-header">2D Текстура</div>
        <div id="zoomPanContainer" class="zoom-pan-container">
          <div id="canvas2d" class="canvas-container"></div>
        </div>
      </div>
      <div id="resizeHandle" class="resize-handle"></div>
      <div class="view3d-column tab-content" id="tab-view3d">
        <div class="preview-header">3D Визуализация</div>
        <div id="canvas3d" class="canvas-container"></div>
      </div>
      <div class="pbr-column tab-content" id="tab-pbr">
        <div class="preview-header">PBR Карты</div>
        <div class="pbr-grid-container"><div id="pbrGrid" class="pbr-grid"></div></div>
      </div>
    </div>
  </main>
  <footer class="global-footer"><!-- футер --></footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
